{% set alt_home = slugs[page.other].prefix ~ '/' %}
<header class="masthead">
<a class="masthead__mark" href="{{ url('home') }}" aria-label="{{ t('a11y.home') }}"><span aria-hidden="true">Pinkal</span></a>
<nav class="masthead__nav" aria-label="{{ t('a11y.main_nav') }}">
<a class="masthead__link" href="{{ url('works') }}"{% if page.kind == 'works' %} aria-current="page"{% elif page.kind in ('room', 'work') %} aria-current="true"{% endif %}>{{ t('nav.works') }}</a>
<a class="masthead__link" href="{{ url('enquire') }}"{% if page.kind == 'enquire' %} aria-current="page"{% endif %}>{{ t('nav.enquire') }}</a>
<a class="masthead__lang" href="{{ page.alt_path or alt_home }}" hreflang="{{ page.other }}" lang="{{ page.other }}" aria-label="{{ t('a11y.lang') }}">{{ t('nav.lang') }}</a>
<a class="masthead__ig" href="{{ site.instagram }}" rel="me noopener" target="_blank" aria-label="{{ t('a11y.instagram') }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg></a>
</nav>
</header>
{% if page.lang == 'en' and page.alt_path %}
<p class="lang-hint" hidden lang="de"><a href="{{ page.alt_path }}" hreflang="de">{{ t('hint.de') }}</a></p>
{% endif %}
