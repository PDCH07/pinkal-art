{# Enquiry form: plain Formspree POST without JS; site.js enhances it (data-* strings below). #}
<form class="form" data-enhance action="{{ formspree }}" method="post" data-subject-prefix="{{ t('form.subject_prefix') }}" data-error-required="{{ t('form.error_name') }}" data-error-email="{{ t('form.error_email') }}" data-sending="{{ t('form.sending') }}" data-sent="{{ t('form.sent') }}" data-failed="{{ t('form.failed', email=legal.email) }}"{% if 'TODO' not in legal.email %} data-mailto="{{ legal.email }}"{% endif %}>
<label class="form__honeypot"><span>Leave this field empty</span><input type="text" name="_gotcha" class="form__honeypot" tabindex="-1" autocomplete="off"></label>
<input type="hidden" name="_subject" value="{{ t('form.subject_general') }}">
<input type="hidden" name="work_url" value="">
<input type="hidden" name="_next" value="{{ thanks_url }}">
<input type="hidden" name="_language" value="{{ page.lang }}">
<p class="form__intro">{{ t('enquire.intro') }}</p>
<div class="form__field">
<label class="form__label" for="work">{{ t('form.work') }}</label>
<select class="form__select" id="work" name="work">
<option value="">{{ t('form.work_any') }}</option>
{% for v in works %}
<option value="{{ v.id }}" data-url="{{ v.url }}">{{ t('form.work_option', no=v.id, subject=v.subject) }}</option>
{% endfor %}
</select>
</div>
<div class="form__field">
<label class="form__label" for="name">{{ t('form.name') }} <span class="form__req">({{ t('a11y.required') }})</span></label>
<input class="form__input" id="name" name="name" type="text" required autocomplete="name" aria-describedby="err-name" data-error-required="{{ t('form.error_name') }}">
<p class="form__error" id="err-name"></p>
</div>
<div class="form__field">
<label class="form__label" for="email">{{ t('form.email') }} <span class="form__req">({{ t('a11y.required') }})</span></label>
<input class="form__input" id="email" name="email" type="email" required autocomplete="email" inputmode="email" aria-describedby="err-email" data-error-required="{{ t('form.error_email') }}" data-error-format="{{ t('form.error_email') }}">
<p class="form__error" id="err-email"></p>
</div>
<div class="form__field">
<label class="form__label" for="message">{{ t('form.message') }} <span class="form__req">({{ t('a11y.required') }})</span></label>
<textarea class="form__textarea" id="message" name="message" rows="6" required aria-describedby="err-message" data-error-required="{{ t('form.error_message') }}"></textarea>
<p class="form__error" id="err-message"></p>
</div>
{% if legal.form_consent_checkbox %}
<div class="form__field form__field--check">
<input class="form__check" id="consent" name="consent" type="checkbox" required value="yes" aria-describedby="err-consent" data-error-required="{{ t('form.error_message') }}">
<label class="form__label" for="consent">{{ t('form.consent') }}</label>
<p class="form__error" id="err-consent"></p>
</div>
{% endif %}
<p class="form__privacy">{{ t('form.privacy') }} <a href="/datenschutz/">{{ t('enquire.trust_privacy_link') }}</a></p>
<button class="btn btn--primary form__submit" type="submit">{{ t('form.submit') }}</button>
<p class="form__status" role="status" aria-live="polite"></p>
</form>
